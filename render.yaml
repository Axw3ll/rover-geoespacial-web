# Despliegue en Render (https://render.com): New + → Blueprint → elegir este repositorio.
# Los valores con "sync: false" se piden en el panel al crear el servicio (no se guardan en git).
services:
  - type: web
    name: rover-geoespacial-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /login.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render genera una cadena aleatoria segura
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MQTT_URL
        value: mqtt://test.mosquitto.org:1883
      - key: MQTT_WS_URL
        value: wss://test.mosquitto.org:8081/mqtt
      - key: MQTT_TOPIC_PREFIX
        value: udec/telematica/equipoX
      - key: DEVICE_ID
        value: CAR01
      - key: GATEWAY_ID
        value: GW01
      - key: PLANNER_ENABLED
        value: "true"
      - key: TZ
        value: America/Mexico_City
